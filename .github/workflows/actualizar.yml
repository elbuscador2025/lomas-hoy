name: Actualizar datos
on:
  schedule:
    - cron: "*/20 * * * *"   # cada 20 minutos
  workflow_dispatch: {}
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/actualizar.mjs
        env:
          SITIO_URL: ${{ secrets.SITIO_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          SUBTE_CLIENT_ID: ${{ secrets.SUBTE_CLIENT_ID }}
          SUBTE_CLIENT_SECRET: ${{ secrets.SUBTE_CLIENT_SECRET }}
